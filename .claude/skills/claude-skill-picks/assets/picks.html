<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude 스킬 모음</title>
<style>
  :root {
    --bg: #f6f5f2; --surface: #ffffff; --ink: #1d1b18; --muted: #6b665e;
    --line: #e4e0d8; --accent: #c2410c; --accent-ink: #ffffff;
    --code-bg: #f1eee8; --warn: #a16207; --warn-bg: #fef3c7;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141311; --surface: #1d1b18; --ink: #f1eee8; --muted: #a8a196;
      --line: #34302a; --accent: #fb923c; --accent-ink: #1d1b18;
      --code-bg: #262320; --warn: #fcd34d; --warn-bg: #3a2f12;
    }
  }
  :root[data-theme="dark"] {
    --bg: #141311; --surface: #1d1b18; --ink: #f1eee8; --muted: #a8a196;
    --line: #34302a; --accent: #fb923c; --accent-ink: #1d1b18;
    --code-bg: #262320; --warn: #fcd34d; --warn-bg: #3a2f12;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.55 system-ui, -apple-system, "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  main { max-width: 880px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 1.6rem; margin: 0 0 4px; }
  .lede { color: var(--muted); margin: 0 0 24px; }

  [role="tablist"] { display: flex; gap: 4px; overflow-x: auto; border-bottom: 1px solid var(--line); }
  [role="tab"] { flex: none; appearance: none; border: 0; background: none; color: var(--muted);
    font: inherit; font-weight: 600; padding: 10px 14px; border-bottom: 3px solid transparent; cursor: pointer; }
  [role="tab"][aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
  [role="tab"]:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; border-radius: 6px; }
  [role="tabpanel"] { padding-top: 20px; }
  [role="tabpanel"]:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: 8px; }

  .src { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; color: var(--muted); font-size: .92rem; margin-bottom: 16px; }
  .src a { color: var(--accent); }
  .pending { background: var(--warn-bg); color: var(--warn); border-radius: 10px; padding: 14px 16px; }

  ol.cards { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px;
    display: grid; grid-template-columns: 52px 1fr; gap: 4px 14px; }
  .rank { grid-row: span 3; width: 52px; height: 52px; border-radius: 12px; display: grid; place-items: center;
    background: var(--accent); color: var(--accent-ink); font-weight: 800; font-size: 1.15rem; }
  .card h3 { margin: 0; font-size: 1.08rem; display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: baseline; }
  .card h3 a { color: var(--muted); font-weight: 500; font-size: .88rem; }
  .card p { margin: 0; }
  .tag { font-size: .75rem; font-weight: 700; padding: 1px 8px; border-radius: 999px; background: var(--warn-bg); color: var(--warn); }
  pre { margin: 6px 0 0; background: var(--code-bg); border-radius: 8px; padding: 8px 10px; overflow-x: auto;
    font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre-wrap; word-break: break-all; }
  .noinstall { color: var(--muted); font-size: .9rem; }
  footer { margin-top: 32px; color: var(--muted); font-size: .85rem; }
  @media (max-width: 480px) {
    .card { grid-template-columns: 40px 1fr; }
    .rank { width: 40px; height: 40px; font-size: 1rem; }
  }
</style>
</head>
<body>
<main>
  <h1>Claude 스킬 모음</h1>
  <p class="lede">릴스·영상에서 추천한 Claude Code 스킬을 출처별 탭으로 모았습니다. 설명은 원문을 옮기지 않고 직접 정리한 요약입니다.</p>
  <div role="tablist" aria-label="출처" id="tabs"></div>
  <div id="panels"></div>
  <footer>설치 명령은 각 저장소 README 기준입니다. 설치 전에 저장소를 한 번 확인하세요.</footer>
</main>

<script id="picks-data" type="application/json">
{
  "sources": [
    {
      "id": "reel-DeqOcQ8ROH5",
      "label": "릴스 1 · TOP 8",
      "url": "https://www.instagram.com/reels/DeqOcQ8ROH5/",
      "note": "Claude Code 스킬 순위 8선 (설명은 영상에서 가려져 있어 직접 정리)",
      "status": "done",
      "items": [
        { "rank": 1, "name": "레아", "repo": "", "summary": "릴스에서 1위로 꼽혔지만 어떤 스킬인지 아직 확인하지 못했습니다. 정확한 영문 이름을 알면 채워 넣습니다.", "install": "", "confidence": "unknown" },
        { "rank": 2, "name": "슈퍼파워스 (Superpowers)", "repo": "obra/superpowers", "summary": "브레인스토밍, 계획, TDD, 디버깅, 검증까지 개발 과정을 단계별로 강제하는 방법론 묶음. 가장 널리 쓰이는 스킬 팩 중 하나입니다.", "install": "/plugin marketplace add obra/superpowers-marketplace\n/plugin install superpowers@superpowers-marketplace", "confidence": "confirmed" },
        { "rank": 3, "name": "지스택 (gstack)", "repo": "garrytan/gstack", "summary": "YC CEO 개리 탄이 공개한 스킬 세트. CEO·디자이너·엔지니어링 매니저·QA 같은 역할별 명령(/office-hours, /review, /qa, /ship 등)으로 혼자서도 팀처럼 일하게 해 줍니다.", "install": "git clone https://github.com/garrytan/gstack ~/.claude/skills/gstack\ncd ~/.claude/skills/gstack && ./setup", "confidence": "confirmed" },
        { "rank": 4, "name": "에브리씽 클로드 코드 (Everything Claude Code)", "repo": "affaan-m/everything-claude-code", "summary": "에이전트, 스킬, 훅, 명령, 규칙을 한꺼번에 담은 종합 설정 모음. 규칙(rules)은 플러그인으로 배포되지 않아 별도 설치가 필요합니다.", "install": "/plugin marketplace add affaan-m/everything-claude-code\n/plugin install everything-claude-code@everything-claude-code", "confidence": "confirmed" },
        { "rank": 5, "name": "맷 포콕 (Matt Pocock skills)", "repo": "mattpocock/skills", "summary": "TypeScript 강사 맷 포콕이 실제로 쓰는 엔지니어링 스킬. 코드 작성 전에 질문으로 요구사항을 파고드는 /grill-me, 레드-그린-리팩터를 지키게 하는 /tdd 등이 있습니다.", "install": "npx skills@latest add mattpocock/skills", "confidence": "confirmed" },
        { "rank": 6, "name": "애디 오스마니 (Agent Skills)", "repo": "addyosmani/agent-skills", "summary": "구글 크롬 팀 애디 오스마니가 시니어 엔지니어의 작업 방식(품질 기준, 체크리스트, 리뷰 흐름)을 스킬로 옮긴 모음입니다.", "install": "", "confidence": "confirmed" },
        { "rank": 7, "name": "리액트 베스트 프랙티스", "repo": "vercel-labs/agent-skills", "summary": "Vercel이 만든 React·Next.js 성능 규칙 모음. 비동기 워터폴 제거, 번들 크기 줄이기 등 우선순위별 규칙으로 코드를 점검합니다.", "install": "npx skills add https://github.com/vercel-labs/agent-skills --skill vercel-react-best-practices", "confidence": "confirmed" },
        { "rank": 8, "name": "아키파이 (Archify)", "repo": "tt-a1i/archify", "summary": "아이디어, 계획, 코드베이스를 아키텍처·흐름·시퀀스 다이어그램이 담긴 인터랙티브 HTML로 바꿔 줍니다. 이름 발음으로 추정한 매칭입니다.", "install": "npx skills add tt-a1i/archify -g", "confidence": "likely" }
      ]
    },
    {
      "id": "reel-DfCFP1ejhE1",
      "label": "릴스 2",
      "url": "https://www.instagram.com/reels/DfCFP1ejhE1/",
      "note": "",
      "status": "pending",
      "items": []
    }
  ]
}
</script>
<script>
(() => {
  const data = JSON.parse(document.getElementById('picks-data').textContent);
  const tablist = document.getElementById('tabs');
  const panels = document.getElementById('panels');
  const el = (tag, attrs = {}, text) => {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
    if (text != null) n.textContent = text;
    return n;
  };
  const tags = { likely: '추정', unknown: '확인 필요' };

  data.sources.forEach((src, i) => {
    const tab = el('button', { role: 'tab', id: `tab-${src.id}`, 'aria-controls': `panel-${src.id}`,
      'aria-selected': i === 0 ? 'true' : 'false', tabindex: i === 0 ? '0' : '-1' }, src.label);
    tablist.append(tab);

    const panel = el('section', { role: 'tabpanel', id: `panel-${src.id}`, 'aria-labelledby': tab.id, tabindex: '0' });
    if (i !== 0) panel.hidden = true;

    const meta = el('div', { class: 'src' });
    const link = el('a', { href: src.url, target: '_blank', rel: 'noopener' }, '원본 보기');
    if (src.note) meta.append(el('span', {}, src.note));
    meta.append(link);
    panel.append(meta);

    if (src.status === 'pending' || !src.items.length) {
      panel.append(el('p', { class: 'pending' }, '아직 내용을 받지 못했습니다. 이 릴스의 화면 캡처나 캡션을 보내주면 채워 넣습니다.'));
    } else {
      const list = el('ol', { class: 'cards' });
      [...src.items].sort((a, b) => a.rank - b.rank).forEach(it => {
        const li = el('li', { class: 'card' });
        li.append(el('div', { class: 'rank', 'aria-label': `${it.rank}위` }, `${it.rank}`));
        const h = el('h3', {}, it.name);
        if (tags[it.confidence]) h.append(el('span', { class: 'tag' }, tags[it.confidence]));
        if (it.repo) h.append(el('a', { href: `https://github.com/${it.repo}`, target: '_blank', rel: 'noopener' }, it.repo));
        li.append(h, el('p', {}, it.summary));
        li.append(it.install ? el('pre', {}, it.install) : el('p', { class: 'noinstall' }, '설치 방법은 저장소 README를 확인하세요.'));
        list.append(li);
      });
      panel.append(list);
    }
    panels.append(panel);
  });

  const tabs = [...tablist.querySelectorAll('[role="tab"]')];
  const select = (t) => {
    tabs.forEach(x => {
      const on = x === t;
      x.setAttribute('aria-selected', on);
      x.tabIndex = on ? 0 : -1;
      document.getElementById(x.getAttribute('aria-controls')).hidden = !on;
    });
    t.focus();
  };
  tablist.addEventListener('click', e => { const t = e.target.closest('[role="tab"]'); if (t) select(t); });
  tablist.addEventListener('keydown', e => {
    const i = tabs.indexOf(document.activeElement);
    if (i < 0) return;
    const next = { ArrowRight: i + 1, ArrowLeft: i - 1, Home: 0, End: tabs.length - 1 }[e.key];
    if (next == null) return;
    e.preventDefault();
    select(tabs[(next + tabs.length) % tabs.length]);
  });
})();
</script>
</body>
</html>
